<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ZHI 个人令牌管理</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18211f;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:32px auto;padding:0 16px}.card{background:white;border:1px solid #dbe4dc;border-radius:16px;padding:22px;margin-bottom:16px}h1{font-size:1.35rem;margin:0 0 8px}h2{font-size:1.05rem;margin:0 0 14px}p{line-height:1.55}.muted{color:#5d6b62;font-size:.9rem}label{display:block;margin:12px 0 6px;font-size:.92rem}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #cbd7ce;width:100%}input,select{background:#fff;color:#17231c}button{background:#205b49;color:#fff;border:0;cursor:pointer}button.secondary{background:#e8efea;color:#1c4539}button.danger{background:#fff0ee;color:#8a2f27}button:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{min-height:1.4em;white-space:pre-wrap;overflow-wrap:anywhere}.result{background:#eef6f0;padding:14px;border-radius:12px;overflow-wrap:anywhere}.token{font-family:ui-monospace,monospace;word-break:break-all}.hidden{display:none!important}.warn{background:#fff7e5;border-radius:10px;padding:12px;font-size:.9rem}@media(max-width:560px){.grid{grid-template-columns:1fr}main{margin:18px auto}.card{padding:17px}}
</style></head><body><main>
<section class="card"><h1>ZHI 个人令牌管理</h1><p class="muted">为每位使用者签发独立令牌，或撤销已遗失/不再使用的令牌。此管理页面可公开访问，但只有持有管理员密钥的人才能执行操作。</p><div class="warn">安全提示：管理员密钥只在本次页面内存中使用，不会写入 GitHub 或浏览器存储。不要把管理员密钥或个人令牌发给他人。</div></section>
<section class="card"><h2>管理员验证</h2><label for="adminSecret">ZHI_TOKEN_ADMIN_SECRET</label><input id="adminSecret" type="password" autocomplete="off" spellcheck="false" placeholder="输入 Supabase 中配置的管理员密钥"><p class="muted">密钥只会通过 HTTPS 发送到 Supabase 的令牌管理服务。</p><button id="unlock">验证并启用管理操作</button><p id="authStatus" class="status muted" role="status" aria-live="polite"></p></section>
<section id="createPanel" class="card hidden"><h2>签发个人令牌</h2><label for="label">使用者标签</label><input id="label" maxlength="100" placeholder="例如：本人、使用者B"><div class="grid"><div><label for="days">有效期</label><select id="days"><option value="30">30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365" selected>365 天</option><option value="730">2 年</option></select></div><div style="align-self:end"><button id="create">生成独立令牌</button></div></div><p id="createStatus" class="status muted" role="status" aria-live="polite"></p><div id="newResult" class="result hidden"><strong>令牌已生成——请立即保存</strong><p class="muted">原始令牌只显示这一次。离开页面后无法从数据库恢复。</p><p id="newToken" class="token"></p><div class="grid"><button id="copyToken" type="button">复制令牌</button><button id="hideToken" class="secondary" type="button">隐藏令牌</button></div><p id="tokenMeta" class="muted"></p></div></section>
<section id="revokePanel" class="card hidden"><h2>撤销令牌</h2><label for="tokenId">令牌 ID（token_id）</label><input id="tokenId" spellcheck="false" placeholder="粘贴签发时保存的 token_id"><p class="muted">撤销后，令牌后续请求将被拒绝。撤销不会自动删除此身份已保存的历史记录。</p><button id="revoke" class="danger">撤销此令牌</button><p id="revokeStatus" class="status muted" role="status" aria-live="polite"></p></section>
<p class="muted"><a href="./">返回 ZHI 健康生活顾问</a></p></main>
<script>
const API="https://lvxmygrgqtmzqgailmyl.supabase.co/functions/v1/zhi-token-admin";
const $=id=>document.getElementById(id);let secret="",enabled=false,lastToken="";
async function call(body){const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+secret},body:JSON.stringify(body),cache:"no-store",credentials:"omit"});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error==="unauthorized"?"管理员密钥不正确。":data.error||"请求失败（HTTP "+r.status+"）");return data;}
$("unlock").onclick=async()=>{secret=$("adminSecret").value.trim();if(!secret){$("authStatus").textContent="请输入管理员密钥。";return;}$("unlock").disabled=true;$("authStatus").textContent="正在验证…";try{await call({action:"create",label:"验证测试-"+crypto.randomUUID(),expires_in_days:1}).then(async r=>{lastToken=r.token;try{await call({action:"revoke",token_id:r.token_id});}catch(e){throw new Error("验证令牌已生成，但自动撤销未确认；请立即在撤销区域检查。");}lastToken="";});enabled=true;$("createPanel").classList.remove("hidden");$("revokePanel").classList.remove("hidden");$("authStatus").textContent="管理员验证成功。可以签发或撤销令牌。";$("adminSecret").value="";}catch(e){secret="";enabled=false;$("authStatus").textContent=e.message;}finally{$("unlock").disabled=false;}};
$("create").onclick=async()=>{if(!enabled||!secret)return;const label=$("label").value.trim();if(!label){$("createStatus").textContent="请填写使用者标签。";return;} $("create").disabled=true;$("createStatus").textContent="正在生成…";$("newResult").classList.add("hidden");try{const r=await call({action:"create",label,expires_in_days:Number($("days").value)});lastToken=r.token;$("newToken").textContent=r.token;$("tokenId").value=r.token_id;$("tokenMeta").textContent="标签："+r.label+" · 过期时间："+new Date(r.expires_at).toLocaleString()+" · token_id 已填入撤销区域";$("newResult").classList.remove("hidden");$("createStatus").textContent="生成成功。请立即复制令牌并安全保存。";}catch(e){$("createStatus").textContent=e.message;if(/unauthorized/.test(e.message)){enabled=false;secret="";$("createPanel").classList.add("hidden");$("revokePanel").classList.add("hidden");}}finally{$("create").disabled=false;}};
$("copyToken").onclick=async()=>{try{await navigator.clipboard.writeText(lastToken);$("copyToken").textContent="已复制";}catch{$("createStatus").textContent="浏览器不允许自动复制，请手动选中令牌复制。";}};
$("hideToken").onclick=()=>{lastToken="";$("newToken").textContent="令牌已隐藏。请确认已安全保存；无法再次显示原令牌。";$("hideToken").disabled=true;$("copyToken").disabled=true;};
$("revoke").onclick=async()=>{if(!enabled||!secret)return;const id=$("tokenId").value.trim();if(!id){$("revokeStatus").textContent="请填写 token_id。";return;}if(!confirm("确定撤销这个令牌？此操作无法撤销。"))return;$("revoke").disabled=true;try{await call({action:"revoke",token_id:id});$("revokeStatus").textContent="令牌已撤销。";}catch(e){$("revokeStatus").textContent=e.message;}finally{$("revoke").disabled=false;}};
window.addEventListener("pagehide",()=>{secret="";lastToken="";});
</script></body></html>
