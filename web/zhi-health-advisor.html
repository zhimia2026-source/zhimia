<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>ZHI 健康生活顾问｜个人空间</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18211f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1c5c4b;color:white}button:disabled{opacity:.5}input[type=text],input[type=password]{width:100%;padding:11px;border:1px solid #cbd5ce;border-radius:10px;background:white}label{display:block;font-size:.92rem;margin:10px 0 5px}.muted{color:#59665f;font-size:.9rem}.danger{color:#8a2f27}.success{color:#1c5c4b}header{padding:20px max(18px,calc((100% - 1100px)/2));background:#fff;border-bottom:1px solid #dfe6e0}header h1{font-size:1.25rem;margin:0 0 5px}header p{margin:0;color:#59665f;font-size:.9rem}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid #dfe6e0;border-radius:16px;padding:18px;min-width:0}h2{font-size:1.05rem;margin:0 0 12px}h3{font-size:.98rem;margin:0 0 8px}.stack{display:grid;gap:10px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}.secondary{background:#e8efea;color:#1c4539}.danger-button{background:#fff0ee;color:#8a2f27}.hidden{display:none!important}.notice{padding:11px 12px;border-radius:10px;background:#f1f5f1;font-size:.9rem;line-height:1.5}.consent{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.5}.consent input{margin-top:5px}#messages{height:52vh;min-height:280px;overflow:auto;border:1px solid #e2e8e3;border-radius:12px;padding:12px;background:#fafbf9;display:flex;flex-direction:column;gap:10px}.bubble{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 13px;border-radius:13px;line-height:1.55}.user{align-self:flex-end;background:#dceee6}.assistant{align-self:flex-start;background:#eef1ed}.meta{font-size:.75rem;color:#647168;margin-top:5px}#messageForm{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}#messageInput{min-height:46px}#historyList{display:grid;gap:7px;margin-top:12px}.history-item{width:100%;text-align:left;background:#f1f5f1;color:#1c4539;overflow-wrap:anywhere}.small{font-size:.8rem}.status{min-height:1.4em;font-size:.9rem}@media(max-width:760px){main{grid-template-columns:1fr;margin:14px auto}#messages{height:45vh;min-height:240px}header{padding:16px}}
</style></head><body><header><h1>ZHI 健康生活顾问</h1><p>个人令牌认证 · 私有会话 · 默认不写长期记忆</p></header>
<main><aside class="panel">
<section id="authPanel"><h2>令牌登录</h2><p class="muted">请输入管理员为你签发的个人令牌。令牌只在当前浏览器会话中保存，不要转发给他人。</p><form id="authForm" class="stack"><div><label for="token">个人令牌</label><input id="token" type="password" autocomplete="off" spellcheck="false" required maxlength="160" placeholder="zhi_live_…"></div><button id="loginBtn" type="submit">登录</button></form><p id="authStatus" class="status muted" role="status" aria-live="polite"></p></section>
<section id="accountPanel" class="hidden"><h2>个人空间</h2><p id="accountLabel" class="muted"></p><button id="logoutBtn" class="secondary">退出登录</button><hr style="border:0;border-top:1px solid #e2e8e3;margin:16px 0"><h3>聊天记录授权</h3><p class="muted">未授权时只进行临时问答，不读取或保存聊天内容。授权后才保存你的会话和消息。</p><label class="consent"><input id="storageConsent" type="checkbox"><span>我明确同意在个人令牌对应的个人空间内保存健康顾问聊天记录（政策 v1.0），并知晓可随时撤销。</span></label><p id="consentStatus" class="status muted" role="status" aria-live="polite"></p><div id="historySection" class="hidden"><div class="row"><h3 style="margin:12px 0 0">我的会话</h3><button id="refreshHistoryBtn" class="secondary small" type="button">刷新</button></div><div id="historyList"></div><button id="deleteConversationBtn" class="danger-button hidden" type="button" style="margin-top:10px">删除当前会话</button></div></section>
<div class="notice" style="margin-top:16px">健康顾问不提供临床诊断或处方。关键词筛查不能排除急症；如出现严重胸痛、呼吸困难或其他紧急情况，请立即联系当地急救服务。</div></aside>
<section class="panel"><h2>咨询</h2><p id="chatNotice" class="muted">请先使用个人令牌登录。</p><div id="messages" aria-live="polite" aria-label="聊天内容"></div><form id="messageForm"><input id="messageInput" type="text" placeholder="例如：如何建立更规律的睡眠习惯？" maxlength="6000" required disabled><button id="sendBtn" type="submit" disabled>发送</button></form><p id="chatStatus" class="status muted" role="status" aria-live="polite"></p><p class="muted small">不会自动建立长期健康记忆。模型回答未经独立医学审核，重要医疗决定请向合格专业人员核实。</p></section></main>
<script type="module">
import { createTokenClient } from "./zhi-health-advisor-client.js";
const api=createTokenClient();const $=id=>document.getElementById(id);let current=null,consented=false,busy=false;
function status(id,msg,kind="muted"){$(id).textContent=msg||"";$(id).className="status "+kind;}
function bubble(role,content,meta=""){const w=document.createElement("div");w.className="bubble "+role;w.textContent=content;if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;w.appendChild(m);} $("messages").appendChild(w);$("messages").scrollTop=$("messages").scrollHeight;}
function clearChat(){$("messages").replaceChildren();current=null;$("deleteConversationBtn").classList.add("hidden");}
function signedIn(ok,label=""){ $("authPanel").classList.toggle("hidden",ok);$("accountPanel").classList.toggle("hidden",!ok);$("accountLabel").textContent=label?"令牌身份："+label:"";$("messageInput").disabled=!ok;$("sendBtn").disabled=!ok;$("chatNotice").textContent=ok?"令牌已由服务端验证。未授权保存时只使用当前消息，不读取或写入聊天历史。":"请先使用个人令牌登录。";if(!ok){consented=false;$("storageConsent").checked=false;$("historySection").classList.add("hidden");$("historyList").replaceChildren();clearChat();}}
async function history(){if(!consented)return;try{const r=await api.conversations();const list=$("historyList");list.replaceChildren();for(const item of r.items||[]){const b=document.createElement("button");b.type="button";b.className="history-item";b.textContent=(item.title||"健康生活咨询")+" · "+new Date(item.updated_at).toLocaleString();b.onclick=()=>load(item.id);list.appendChild(b);}if(!(r.items||[]).length){const p=document.createElement("p");p.className="muted small";p.textContent="还没有保存的会话。";list.appendChild(p);}}catch(e){status("chatStatus",e.message,"danger");}}
async function load(id){try{const r=await api.messages(id);current=id;clearChat();current=id;for(const m of r.items||[])bubble(m.role==="user"?"user":"assistant",m.content,m.role==="assistant"?"确定性 "+(m.certainty_level||"L0"):"");$("deleteConversationBtn").classList.remove("hidden");}catch(e){status("chatStatus",e.message,"danger");}}
async function refreshConsent(){try{const r=await api.consentGet();consented=!!r.granted;$("storageConsent").checked=consented;$("historySection").classList.toggle("hidden",!consented);status("consentStatus",consented?"已授权保存聊天记录。":"未授权保存：仅支持临时问答。");if(consented)await history();}catch(e){status("consentStatus",e.message,"danger");}}
async function login(token){const r=await api.login(token);signedIn(true,r.label);status("authStatus","令牌验证成功。","success");$("token").value="";clearChat();await refreshConsent();}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;status("authStatus","正在验证令牌…");try{await login($("token").value.trim());}catch(err){api.logout();signedIn(false);status("authStatus",err.message,"danger");}finally{$("loginBtn").disabled=false;}});
$("logoutBtn").onclick=()=>{api.logout();signedIn(false);status("authStatus","已退出登录。","success");};
$("storageConsent").addEventListener("change",async e=>{const want=e.target.checked;if(want&&!confirm("确认同意保存你的健康顾问聊天记录？内容会保存在个人账号对应的私有空间内。")){e.target.checked=false;return;}try{await api.consentSet(want);consented=want;$("historySection").classList.toggle("hidden",!want);if(want){status("consentStatus","已授权保存。","success");await history();}else{current=null;$("deleteConversationBtn").classList.add("hidden");$("historyList").replaceChildren();status("consentStatus","已撤销后续历史读取/保存授权。既有记录不会自动删除。");}}catch(err){e.target.checked=!want;status("consentStatus",err.message,"danger");}});
$("refreshHistoryBtn").onclick=history;
$("deleteConversationBtn").onclick=async()=>{if(!current||!confirm("永久删除当前会话及其消息？此操作无法撤销。"))return;try{await api.deleteConversation(current);clearChat();status("chatStatus","会话已删除。","success");await history();}catch(e){status("chatStatus",e.message,"danger");}};
$("messageForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;const message=$("messageInput").value.trim();if(!message)return;busy=true;$("sendBtn").disabled=true;$("messageInput").disabled=true;$("messageInput").value="";bubble("user",message);status("chatStatus","健康顾问正在整理回应…");try{const r=await api.chat(message,consented?current:null);bubble("assistant",r.answer,"确定性 "+(r.certainty_level||"L0")+(r.safety_override?" · 安全响应":"")+(r.persisted===false?" · 本轮未保存":""));if(r.persisted&&r.conversation_id){current=r.conversation_id;$("deleteConversationBtn").classList.remove("hidden");await history();}status("chatStatus",(r.limitations||[]).join(" ")+(r.memory_written===false?" 本轮未写入长期记忆。":""));}catch(err){status("chatStatus",err.message,"danger");}finally{busy=false;$("sendBtn").disabled=false;$("messageInput").disabled=false;}});
const restored=await api.restore();if(restored){signedIn(true,restored.label);await refreshConsent();}else bubble("assistant","你好。请先使用个人令牌登录；未授权保存聊天记录时，仍可进行临时问答。");
</script></body></html>
