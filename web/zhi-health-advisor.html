<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>关心｜家庭陪伴智能人</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18211f;background:#f6f8f6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;height:100%;}body{height:100dvh;overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#1c5c4b;color:white}button:disabled{opacity:.5}input[type=text],input[type=password]{width:100%;min-width:0;padding:12px;border:1px solid #cbd5ce;border-radius:12px;background:white;outline-color:#7aab98}label{display:block;font-size:.9rem;margin:8px 0 5px}.muted{color:#65716a;font-size:.82rem}.danger{color:#8a2f27}.success{color:#1c5c4b}header{height:60px;padding:0 18px;display:flex;align-items:center;background:#fff;border-bottom:1px solid #e5ebe6}header h1{font-size:1.12rem;margin:0;font-weight:650}header p{display:none}main{height:calc(100dvh - 60px);max-width:820px;margin:0 auto;padding:12px 16px;display:flex;min-height:0}.panel{background:#fff;border:1px solid #e1e8e2;border-radius:18px;padding:14px;min-width:0;min-height:0;width:100%;display:flex;flex-direction:column}aside{display:none!important}main>.panel{gap:10px}h2{font-size:1rem;margin:0}h3{font-size:.92rem;margin:0 0 8px}.stack{display:grid;gap:8px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}.secondary{background:#edf2ee;color:#244b3f}.danger-button{background:#fff0ee;color:#8a2f27}.hidden{display:none!important}.notice{padding:8px 10px;border-radius:10px;background:#f1f5f1;font-size:.8rem;line-height:1.45}.consent{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;line-height:1.4}.consent input{margin-top:4px}#authPanel{max-width:440px;width:100%;margin:auto}#authPanel h2{font-size:1.1rem}#accountPanel{order:-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}#accountPanel h2,#accountPanel>p,#accountPanel hr,#accountPanel h3,#accountPanel #consentStatus,#historySection{display:none!important}#accountPanel .consent{display:flex!important;margin:0;max-width:calc(100% - 90px);font-size:.75rem}#logoutBtn{padding:7px 10px;font-size:.8rem;margin-left:auto}#messages{flex:1;min-height:0;overflow:auto;border:0;border-radius:12px;padding:8px 2px;background:#fff;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}.bubble{max-width:min(88%,620px);white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 14px;border-radius:16px;line-height:1.55;font-size:.96rem}.user{align-self:flex-end;background:#dceee6;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#f0f3f0;border-bottom-left-radius:5px}.meta{font-size:.72rem;color:#647168;margin-top:5px}#messageForm{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding-top:8px;border-top:1px solid #edf0ed}#messageInput{min-height:46px;border-radius:14px}#messageForm button{min-width:68px}#historyList{display:grid;gap:7px;margin-top:12px}.history-item{width:100%;text-align:left;background:#f1f5f1;color:#1c4539;overflow-wrap:anywhere}.small{font-size:.76rem}.status{min-height:1.2em;font-size:.8rem;margin:0}.panel>.muted.small{font-size:.72rem;margin:0;text-align:center}#chatNotice{margin:0;font-size:.8rem}#chatStatus:empty{display:none}@media(max-width:600px){header{height:54px;padding:0 16px}main{height:calc(100dvh - 54px);padding:0}main>.panel{border:0;border-radius:0;padding:12px 12px max(10px,env(safe-area-inset-bottom));gap:8px}#messages{padding:8px 0;gap:10px}.bubble{max-width:90%;font-size:.95rem;padding:10px 12px}#messageForm{gap:7px;padding-top:8px}#messageInput{font-size:16px;min-height:44px;padding:10px 12px}#messageForm button{padding:10px 13px;min-width:60px}#accountPanel{padding:2px 0}#logoutBtn{padding:6px 9px}#authPanel{padding:18px}#authPanel .muted{line-height:1.5}}
</style></head><body><header><h1>关心</h1><p>一个医学知识丰富、也能自由聊天的家庭陪伴者 · 个人身份隔离 · 长期记忆默认关闭</p></header>
<main>
<section class="panel">
<section id="authPanel"><h2>登录关心</h2><p class="muted">使用你的个人令牌登录。请勿将令牌分享给他人。</p><form id="authForm" class="stack"><div><label for="token">个人令牌</label><input id="token" type="password" autocomplete="off" spellcheck="false" required maxlength="160" placeholder="输入个人令牌"></div><button id="loginBtn" type="submit">登录</button></form><p id="authStatus" class="status muted" role="status" aria-live="polite"></p></section>
<section id="accountPanel" class="hidden"><h2>关心</h2><p id="accountLabel" class="muted"></p><button id="logoutBtn" class="secondary">退出</button><hr style="border:0;border-top:1px solid #e2e8e3;margin:16px 0"><h3>聊天记录授权</h3><p class="muted">默认不保存聊天记录；授权后仅保存在你的个人空间。</p><label class="consent"><input id="storageConsent" type="checkbox"><span>我同意保存聊天记录，可随时撤销。</span></label><p id="consentStatus" class="status muted" role="status" aria-live="polite"></p><div id="historySection" class="hidden"><div class="row"><h3 style="margin:12px 0 0">我的会话</h3><button id="refreshHistoryBtn" class="secondary small" type="button">刷新</button></div><div id="historyList"></div><button id="deleteConversationBtn" class="danger-button hidden" type="button" style="margin-top:10px">删除当前会话</button></div></section>
<p class="muted small" style="margin-top:auto">健康信息仅供参考；紧急情况请联系当地急救服务。</p>
<h2 id="chatTitle">和关心聊聊</h2><p id="chatNotice" class="muted">请先使用个人令牌登录。</p><div id="messages" aria-live="polite" aria-label="聊天内容"></div><form id="messageForm"><input id="messageInput" type="text" placeholder="发消息给关心…" maxlength="6000" required disabled><button id="sendBtn" type="submit" disabled>发送</button></form><p id="chatStatus" class="status muted" role="status" aria-live="polite"></p><p class="muted small">未授权保存时仅进行临时问答；不会自动建立长期健康记忆。</p>
</section></main>
<script type="module">
import { createTokenClient } from "./zhi-health-advisor-client.js";
const api=createTokenClient();const $=id=>document.getElementById(id);let current=null,consented=false,busy=false;
function status(id,msg,kind="muted"){$(id).textContent=msg||"";$(id).className="status "+kind;}
function bubble(role,content,meta=""){const w=document.createElement("div");w.className="bubble "+role;w.textContent=content;if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;w.appendChild(m);} $("messages").appendChild(w);$("messages").scrollTop=$("messages").scrollHeight;}
function clearChat(){$("messages").replaceChildren();current=null;$("deleteConversationBtn").classList.add("hidden");}
function signedIn(ok,label=""){ $("authPanel").classList.toggle("hidden",ok);$("accountPanel").classList.toggle("hidden",!ok);$("accountLabel").textContent=label?"令牌身份："+label:"";$("messageInput").disabled=!ok;$("sendBtn").disabled=!ok;$("chatNotice").textContent=ok?"令牌已由服务端验证。未授权保存时只使用当前消息，不读取或写入聊天历史。":"请先使用个人令牌登录。";if(!ok){consented=false;$("storageConsent").checked=false;$("historySection").classList.add("hidden");$("historyList").replaceChildren();clearChat();}}
async function history(){if(!consented)return;try{const r=await api.conversations();const list=$("historyList");list.replaceChildren();for(const item of r.items||[]){const b=document.createElement("button");b.type="button";b.className="history-item";b.textContent=(item.title||"和关心的聊天")+" · "+new Date(item.updated_at).toLocaleString();b.onclick=()=>load(item.id);list.appendChild(b);}if(!(r.items||[]).length){const p=document.createElement("p");p.className="muted small";p.textContent="还没有保存的会话。";list.appendChild(p);}}catch(e){status("chatStatus",e.message,"danger");}}
async function load(id){try{const r=await api.messages(id);current=id;clearChat();current=id;for(const m of r.items||[])bubble(m.role==="user"?"user":"assistant",m.content,m.role==="assistant"?"确定性 "+(m.certainty_level||"L0"):"");$("deleteConversationBtn").classList.remove("hidden");}catch(e){status("chatStatus",e.message,"danger");}}
async function refreshConsent(){try{const r=await api.consentGet();consented=!!r.granted;$("storageConsent").checked=consented;$("historySection").classList.toggle("hidden",!consented);status("consentStatus",consented?"已授权保存聊天记录。":"未授权保存：仅支持临时问答。");if(consented)await history();}catch(e){status("consentStatus",e.message,"danger");}}
async function login(token){const r=await api.login(token);signedIn(true,r.label);status("authStatus","令牌验证成功。","success");$("token").value="";clearChat();await refreshConsent();}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;status("authStatus","正在验证令牌…");try{await login($("token").value.trim());}catch(err){api.logout();signedIn(false);status("authStatus",err.message,"danger");}finally{$("loginBtn").disabled=false;}});
$("logoutBtn").onclick=()=>{api.logout();signedIn(false);status("authStatus","已退出登录。","success");};
$("storageConsent").addEventListener("change",async e=>{const want=e.target.checked;if(want&&!confirm("确认同意保存你与关心的聊天记录？内容会保存在个人账号对应的私有空间内。")){e.target.checked=false;return;}try{await api.consentSet(want);consented=want;$("historySection").classList.toggle("hidden",!want);if(want){status("consentStatus","已授权保存。","success");await history();}else{current=null;$("deleteConversationBtn").classList.add("hidden");$("historyList").replaceChildren();status("consentStatus","已撤销后续历史读取/保存授权。既有记录不会自动删除。");}}catch(err){e.target.checked=!want;status("consentStatus",err.message,"danger");}});
$("refreshHistoryBtn").onclick=history;
$("deleteConversationBtn").onclick=async()=>{if(!current||!confirm("永久删除当前会话及其消息？此操作无法撤销。"))return;try{await api.deleteConversation(current);clearChat();status("chatStatus","会话已删除。","success");await history();}catch(e){status("chatStatus",e.message,"danger");}};
$("messageForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;const message=$("messageInput").value.trim();if(!message)return;busy=true;$("sendBtn").disabled=true;$("messageInput").disabled=true;$("messageInput").value="";bubble("user",message);status("chatStatus","关心正在回应…");try{const r=await api.chat(message,consented?current:null);bubble("assistant",r.answer,"确定性 "+(r.certainty_level||"L0")+(r.safety_override?" · 安全响应":"")+(r.persisted===false?" · 本轮未保存":""));if(r.persisted&&r.conversation_id){current=r.conversation_id;$("deleteConversationBtn").classList.remove("hidden");await history();}status("chatStatus",(r.limitations||[]).join(" ")+(r.memory_written===false?" 本轮未写入长期记忆。":""));}catch(err){status("chatStatus",err.message,"danger");}finally{busy=false;$("sendBtn").disabled=false;$("messageInput").disabled=false;}});
const restored=await api.restore();if(restored){signedIn(true,restored.label);await refreshConsent();}else bubble("assistant","你好，我是关心。你可以和我聊日常、兴趣、家庭生活，也可以问我健康问题。医学是我擅长的领域，但我们不必每次都聊医学。请先使用个人令牌登录；未授权保存聊天记录时，仍可进行临时问答。");
</script></body></html>
