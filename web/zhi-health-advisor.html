<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>ZHI 健康生活顾问｜个人空间</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18211f;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#1c5c4b;color:white}button:disabled{opacity:.5}input[type=email],input[type=password],input[type=text]{width:100%;padding:11px;border:1px solid #cbd5ce;border-radius:10px;background:white}label{display:block;font-size:.92rem;margin:10px 0 5px}.muted{color:#59665f;font-size:.9rem}.danger{color:#8a2f27}.success{color:#1c5c4b}header{padding:20px max(18px,calc((100% - 1100px)/2));background:#fff;border-bottom:1px solid #dfe6e0}header h1{font-size:1.25rem;margin:0 0 5px}header p{margin:0;color:#59665f;font-size:.9rem}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.panel{background:#fff;border:1px solid #dfe6e0;border-radius:16px;padding:18px;min-width:0}h2{font-size:1.05rem;margin:0 0 12px}h3{font-size:.98rem;margin:0 0 8px}.stack{display:grid;gap:10px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}.secondary{background:#e8efea;color:#1c4539}.danger-button{background:#fff0ee;color:#8a2f27}.hidden{display:none!important}.notice{padding:11px 12px;border-radius:10px;background:#f1f5f1;font-size:.9rem;line-height:1.5}.consent{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.5}.consent input{margin-top:5px}#messages{height:52vh;min-height:280px;overflow:auto;border:1px solid #e2e8e3;border-radius:12px;padding:12px;background:#fafbf9;display:flex;flex-direction:column;gap:10px}.bubble{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 13px;border-radius:13px;line-height:1.55}.user{align-self:flex-end;background:#dceee6}.assistant{align-self:flex-start;background:#eef1ed}.meta{font-size:.75rem;color:#647168;margin-top:5px}#messageForm{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}#messageInput{min-height:46px}#historyList{display:grid;gap:7px;margin-top:12px}.history-item{width:100%;text-align:left;background:#f1f5f1;color:#1c4539;overflow-wrap:anywhere}.history-item.active{outline:2px solid #5b8f7d}.small{font-size:.8rem}.status{min-height:1.4em;font-size:.9rem}@media(max-width:760px){main{grid-template-columns:1fr;margin:14px auto}#messages{height:45vh;min-height:240px}header{padding:16px}}
</style></head>
<body>
<header><h1>ZHI 健康生活顾问</h1><p>独立个人登录 · 私有会话 · 默认不写长期记忆</p></header>
<main>
<aside class="panel">
<section id="authPanel"><h2>个人账号</h2><p class="muted">请使用自己的 ZHIMIA 账号。此登录与旧聊天站点的共享管理员令牌相互独立。</p>
<form id="authForm" class="stack"><div><label for="email">电子邮箱</label><input id="email" type="email" autocomplete="username" required maxlength="254"></div><div><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></div><div class="row"><button id="signInBtn" type="submit">登录</button><button id="signUpBtn" type="button" class="secondary">注册</button></div></form><p id="authStatus" class="status muted" role="status" aria-live="polite"></p></section>
<section id="accountPanel" class="hidden"><h2>已登录</h2><p id="accountEmail" class="muted"></p><button id="signOutBtn" class="secondary">退出登录</button><hr style="border:0;border-top:1px solid #e2e8e3;margin:16px 0"><h3>聊天记录授权</h3><p class="muted">不授权也可以进行单轮临时问答。授权后才会保存并读取会话和消息。</p><label class="consent"><input id="storageConsent" type="checkbox"><span>我明确同意在个人账号下保存健康顾问聊天记录（政策 v1.0），并知晓可随时撤销。</span></label><p id="consentStatus" class="status muted" role="status" aria-live="polite"></p>
<div id="historySection" class="hidden"><div class="row"><h3 style="margin:12px 0 0">我的会话</h3><button id="refreshHistoryBtn" class="secondary small" type="button">刷新</button></div><div id="historyList"></div><button id="deleteConversationBtn" class="danger-button hidden" type="button" style="margin-top:10px">删除当前会话</button></div></section>
<div class="notice" style="margin-top:16px">健康顾问不提供临床诊断或处方。关键词筛查不能排除急症；若出现严重胸痛、呼吸困难或其他紧急情况，请立即联系当地急救服务。</div>
</aside>
<section class="panel"><h2>咨询</h2><p id="chatNotice" class="muted">登录后开始。聊天记录只有在你明确授权后才保存。</p><div id="messages" aria-live="polite" aria-label="聊天内容"></div>
<form id="messageForm"><input id="messageInput" type="text" placeholder="例如：如何建立更规律的睡眠习惯？" maxlength="6000" required disabled><button id="sendBtn" type="submit" disabled>发送</button></form>
<p id="chatStatus" class="status muted" role="status" aria-live="polite"></p><p class="muted small">不会自动建立长期健康记忆。模型回答未经独立医学审核，重要医疗决定请向合格专业人员核实。</p></section>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.57.4";
import { createHealthAdvisorClient } from "./zhi-health-advisor-client.js";
const URL = "https://lvxmygrgqtmzqgailmyl.supabase.co";
const KEY = "sb_publishable_VUdhz93MURXgJgT10_SJ_A_oZe4QmWE";
const supabase = createClient(URL, KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.sessionStorage}});
const advisor = createHealthAdvisorClient({supabase});
const $ = id => document.getElementById(id);
let activeConversationId = null, consentGranted = false, busy = false;
function status(id,msg,kind){const e=$(id);e.textContent=msg||"";e.className="status "+(kind||"muted");}
function bubble(role,content,meta){const w=document.createElement("div");w.className="bubble "+role;w.textContent=content;if(meta){const m=document.createElement("div");m.className="meta";m.textContent=meta;w.appendChild(m);} $("messages").appendChild(w);$("messages").scrollTop=$("messages").scrollHeight;}
function clearMessages(){$("messages").replaceChildren();}
function setBusy(v){busy=v;$("sendBtn").disabled=v||!$("messageInput").dataset.signedIn;$("messageInput").disabled=v||!$("messageInput").dataset.signedIn;$("signInBtn").disabled=v;$("signUpBtn").disabled=v;}
function showAccount(user){const yes=Boolean(user);$("authPanel").classList.toggle("hidden",yes);$("accountPanel").classList.toggle("hidden",!yes);$("accountEmail").textContent=user?user.email:"";$("messageInput").dataset.signedIn=yes?"yes":"";$("messageInput").disabled=!yes;$("sendBtn").disabled=!yes;$("chatNotice").textContent=yes?"身份已通过 ZHIMIA Auth 验证。未授权保存时，只使用当前消息，不读取或写入聊天历史。":"请先登录。未登录用户不能调用健康顾问。";if(!yes){consentGranted=false;activeConversationId=null;clearMessages();$("storageConsent").checked=false;$("historySection").classList.add("hidden");$("deleteConversationBtn").classList.add("hidden");$("historyList").replaceChildren();}}
async function refreshHistory(){if(!consentGranted)return;try{const items=await advisor.listConversations();const list=$("historyList");list.replaceChildren();items.forEach(item=>{const b=document.createElement("button");b.type="button";b.className="history-item"+(item.id===activeConversationId?" active":"");b.textContent=(item.title||"健康生活咨询")+" · "+new Date(item.updated_at).toLocaleString();b.addEventListener("click",()=>loadConversation(item.id));list.appendChild(b);});if(!items.length){const p=document.createElement("p");p.className="muted small";p.textContent="还没有保存的会话。";list.appendChild(p);}}catch(e){status("chatStatus",e.message,"danger");}}
async function refreshConsent(){try{consentGranted=await advisor.getChatStorageConsent();$("storageConsent").checked=consentGranted;$("historySection").classList.toggle("hidden",!consentGranted);status("consentStatus",consentGranted?"已授权保存聊天记录。":"未授权保存：仅支持临时问答，不读取历史。");if(consentGranted)await refreshHistory();}catch(e){status("consentStatus",e.message,"danger");}}
async function loadConversation(id){try{const items=await advisor.listMessages({conversationId:id});activeConversationId=id;clearMessages();items.forEach(m=>bubble(m.role==="user"?"user":"assistant",m.content,m.role==="assistant"?"确定性 "+(m.certainty_level||"L0")+(m.safety_override?" · 安全响应":""):""));$("deleteConversationBtn").classList.remove("hidden");await refreshHistory();}catch(e){status("chatStatus",e.message,"danger");}}
$("authForm").addEventListener("submit",async ev=>{ev.preventDefault();setBusy(true);status("authStatus","正在登录…");try{const {error}=await supabase.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;status("authStatus","登录成功。","success");}catch(e){status("authStatus","登录失败："+e.message,"danger");}finally{setBusy(false);}});
$("signUpBtn").addEventListener("click",async()=>{if(!$("authForm").reportValidity())return;setBusy(true);status("authStatus","正在创建账号…");try{const {data,error}=await supabase.auth.signUp({email:$("email").value.trim(),password:$("password").value,options:{emailRedirectTo:window.location.href.split("#")[0].split("?")[0]}});if(error)throw error;status("authStatus",data.session?"注册成功并已登录。":"注册请求已提交。如需邮箱验证，请先打开验证邮件，再返回此页登录。","success");}catch(e){status("authStatus","注册失败："+e.message,"danger");}finally{setBusy(false);}});
$("signOutBtn").addEventListener("click",async()=>{const {error}=await supabase.auth.signOut();if(error)status("authStatus","退出失败："+error.message,"danger");else{showAccount(null);status("authStatus","已退出登录。","success");}});
$("storageConsent").addEventListener("change",async ev=>{const want=ev.target.checked;if(want&&!window.confirm("确认同意保存你的健康顾问聊天记录？历史内容将保存在你的个人账号下。")){ev.target.checked=false;return;}try{await advisor.setChatStorageConsent(want);consentGranted=want;$("historySection").classList.toggle("hidden",!want);if(want){status("consentStatus","已授权。你可以查看和删除自己的会话。","success");await refreshHistory();}else{status("consentStatus","已撤销后续历史读取/保存授权。既有记录不会自动删除；如需删除，请重新授权后逐个删除。","success");activeConversationId=null;$("deleteConversationBtn").classList.add("hidden");$("historyList").replaceChildren();}}catch(e){ev.target.checked=!want;status("consentStatus",e.message,"danger");}});
$("refreshHistoryBtn").addEventListener("click",refreshHistory);
$("deleteConversationBtn").addEventListener("click",async()=>{if(!activeConversationId||!window.confirm("永久删除当前会话及其消息？此操作无法撤销。"))return;try{await advisor.deleteConversation({conversationId:activeConversationId});activeConversationId=null;clearMessages();$("deleteConversationBtn").classList.add("hidden");status("chatStatus","会话已删除。","success");await refreshHistory();}catch(e){status("chatStatus",e.message,"danger");}});
$("messageForm").addEventListener("submit",async ev=>{ev.preventDefault();if(busy||!$("messageInput").dataset.signedIn)return;const message=$("messageInput").value.trim();if(!message)return;$("messageInput").value="";bubble("user",message);setBusy(true);status("chatStatus","健康顾问正在整理回应…");try{const result=await advisor.sendMessage({message,conversationId:consentGranted?activeConversationId:null});bubble("assistant",result.answer,"确定性 "+(result.certainty_level||"L0")+(result.safety_override?" · 安全响应":"")+(result.persisted===false?" · 本轮未保存":""));if(result.persisted!==false&&result.conversation_id){activeConversationId=result.conversation_id;$("deleteConversationBtn").classList.remove("hidden");await refreshHistory();}const limits=Array.isArray(result.limitations)?result.limitations.join(" "):"";status("chatStatus",limits+(result.memory_written===false?" 本轮未写入长期记忆。":""),"muted");}catch(e){status("chatStatus",e.message,"danger");}finally{setBusy(false);}});
supabase.auth.onAuthStateChange((_event,session)=>{const user=session&&session.user?session.user:null;showAccount(user);if(user)window.setTimeout(()=>{refreshConsent();},0);});
const {data:initial}=await supabase.auth.getSession();showAccount(initial.session?initial.session.user:null);if(initial.session)await refreshConsent();else bubble("assistant","你好。请先登录，再开始健康生活咨询。未授权保存聊天记录时，你仍可进行临时问答。");
</script></body></html>
