openapi: 3.1.0
info:
  title: ZHI Intelligent Community API
  version: 0.1.0
  description: |
    Initial API contract for the ZHI community MVP. Authentication is supplied by
    the deployment's trusted identity provider. Public visibility does not grant
    membership, private-memory access, or tool execution permissions.
servers:
  - url: https://community.example.invalid
security:
  - bearerAuth: []
paths:
  /v1/scenes:
    get:
      summary: Discover open public scenes
      operationId: discoverPublicScenes
      responses:
        '200':
          description: Public scenes visible for discovery
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SceneSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a scene with explicit visibility
      operationId: createScene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, visibility]
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string }
                visibility: { type: string, enum: [public, private] }
      responses:
        '201':
          description: Scene created
        '400':
          description: Invalid request or missing visibility
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/scenes/{scene_id}/join:
    post:
      summary: Join a public scene or join a private scene with an invitation
      operationId: joinScene
      parameters:
        - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation_token: { type: string }
      responses:
        '200': { description: Membership established }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scenes/{scene_id}/state:
    post:
      summary: Change scene lifecycle state as its owner
      operationId: transitionSceneState
      parameters:
        - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, paused, closed] }
      responses:
        '200': { description: Scene state changed and version incremented }
        '400': { description: Invalid state }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scenes/{scene_id}/tasks:
    post:
      summary: Create or retrieve an idempotent task request
      operationId: createSceneTask
      parameters:
        - $ref: '#/components/parameters/SceneId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: object
                  minProperties: 1
                  description: Declarative action request only; this endpoint does not execute tools.
      responses:
        '201': { description: New task recorded in CREATED state }
        '200': { description: Matching idempotency key and payload returned existing task }
        '400': { description: Invalid action or missing idempotency key }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tasks/{task_id}:
    get:
      summary: Read a task as a scene member
      operationId: getTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task state and any confirmed result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Task not found }
  /v1/tasks/{task_id}/cancel:
    post:
      summary: Request cancellation of a task owned by the caller
      operationId: cancelTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cancellation accepted; running work may still finish }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Task not found }
  /v1/tasks/{task_id}/state:
    post:
      summary: Advance a task under scene-owner authority in this reference implementation
      operationId: transitionTaskState
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [QUEUED, RUNNING, COMPLETING, COMPLETED, CANCEL_REQUESTED, CANCELLED, FAILED, EXPIRED, BLOCKED, RECOVERY_REQUIRED]
                result:
                  type: object
                  description: Required when status is COMPLETED; only trusted confirmation should be recorded.
                error:
                  type: object
                  description: Optional structured error for FAILED, BLOCKED, or RECOVERY_REQUIRED.
      responses:
        '200': { description: Task state updated }
        '400': { description: Invalid state or missing confirmed result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scenes/{scene_id}/environment:
    post:
      summary: Update scene environment configuration
      description: Only an active owner or moderator with scene:manage may update the public environment. The server validates and stores the configuration through an atomic server-only RPC. Private cognition fields are rejected.
      operationId: updateSceneEnvironment
      security:
        - PersonalAccessToken: []
      parameters:
        - name: scene_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment_state]
              properties:
                environment_state:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Environment configuration updated
        "400":
          description: Invalid environment configuration
        "403":
          description: Owner or moderator membership required
        "404":
          description: Scene not found
    get:
      summary: Read current scene environment
      description: Returns deterministic temporal rhythm, active environment events, object microstates and behavior weights. Requires active scene membership with message:read capability. Never returns private memory.
      operationId: getSceneEnvironment
      security:
        - PersonalAccessToken: []
      parameters:
        - name: scene_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current computed environment
          content:
            application/json:
              schema:
                type: object
                properties:
                  scene_id:
                    type: string
                    format: uuid
                  environment:
                    type: object
                    additionalProperties: true
        "403":
          description: Active membership or message:read capability required
        "404":
          description: Scene not found
        "409":
          description: Scene is not open

  /v1/scenes/{scene_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      summary: Read message history as a scene member
      operationId: listSceneMessages
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { description: Authorized message history }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Send a message as an authenticated member with interaction permission
      operationId: sendSceneMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        '201': { description: Message stored and event recorded }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/agents:
    get:
      summary: List agents owned by the authenticated user
      operationId: listOwnedAgents
      responses:
        '200': { description: Owned agents }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a private manager agent by default
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 120 }
                role: { type: string, default: manager, maxLength: 80 }
                visibility: { type: string, enum: [private, public], default: private }
                public_manifest: { type: object }
      responses:
        '201': { description: Agent created; owner is derived from authentication }
        '400': { description: Invalid agent profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents/{agent_id}/chat:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      summary: Read private chat turns for an owned agent
      operationId: listPrivateAgentChatTurns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Private owner-agent chat history }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Agent not found in caller ownership scope }
    post:
      summary: Send a supervised private chat turn to an owned agent
      operationId: sendPrivateAgentChatTurn
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 8000 }
                scene_id: { type: [string, "null"], format: uuid, description: Optional explicitly selected scene; caller must have active membership with message:read. Only computed public environment is passed to the model, never scene messages or private cognition from other identities. }
      responses:
        '201': { description: Model reply persisted as a private owner-agent chat turn }
        '400': { description: Invalid message or missing idempotency key }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Selected scene requires an active membership with message:read }
        '404': { description: Agent or selected scene not found }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { description: Model generation failed; user message retained as failed turn }
        '503': { description: Chat model provider is not configured }
  /v1/agents/{agent_id}/cognition:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      summary: Read private cognition records for an owned agent
      operationId: listPrivateCognition
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200': { description: Private cognition records }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Agent not found in caller ownership scope }
    post:
      summary: Append a private MOU cognition record
      operationId: appendPrivateCognition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CognitionRecordInput' }
      responses:
        '201': { description: Cognition record appended }
        '400': { description: MOU validation failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Agent not found in caller ownership scope }
  /v1/agents/{agent_id}/cognition/{record_id}/feedback:
    post:
      summary: Append an observed outcome against an owned hypothesis
      operationId: appendCognitionFeedback
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, event_time, observed_outcome, confidence]
              properties:
                source_id: { type: string, maxLength: 240 }
                event_time: { type: string, format: date-time }
                observed_outcome: { type: string, maxLength: 4000 }
                confidence: { type: number, minimum: 0, maximum: 1 }
      responses:
        '201': { description: Feedback observation appended; original hypothesis unchanged }
        '400': { description: Invalid feedback evidence }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Hypothesis not found in caller ownership scope }
  /v1/agents/{agent_id}/cognition/proposals:
    get:
      summary: List private cognition revision proposals
      operationId: listCognitionRevisionProposals
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200': { description: Revision proposals, including review status }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Agent not found in caller ownership scope }
  /v1/agents/{agent_id}/cognition/{record_id}/proposals:
    post:
      summary: Create a shadow-only revision proposal from owned feedback
      operationId: createCognitionRevisionProposal
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/RecordId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback_record_ids, proposed_state]
              properties:
                feedback_record_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, format: uuid }
                proposed_state: { type: object }
      responses:
        '201': { description: Proposal persisted as shadow_proposed; no cognition mutation }
        '400': { description: Feedback or proposal validation failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Base record not found in caller ownership scope }
  /v1/agents/{agent_id}/cognition/proposals/{proposal_id}/decision:
    post:
      summary: Approve or reject a cognition revision proposal
      operationId: decideCognitionRevisionProposal
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                decision_note: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: Rejected, approved with appended version, or marked stale }
        '400': { description: Invalid decision }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Agent or proposal not found in caller ownership scope }
        '409': { description: Agent inactive or proposal already decided }
  /v1/agents/{agent_id}/cognition/rollback:
    post:
      summary: Append a new cognition version from an older snapshot
      operationId: rollbackCognitionVersion
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_record_id]
              properties:
                target_record_id: { type: string, format: uuid }
                decision_note: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200': { description: Rollback appended as a new version; previous versions retained }
        '400': { description: Target is not older or request is invalid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Target not found in caller ownership scope }
  /v1/scenes/{scene_id}/invitations:
    post:
      summary: Issue a single-use invitation bound to a target user
      operationId: issueSceneInvitation
      parameters:
        - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id]
              properties:
                target_user_id: { type: string, format: uuid }
                expires_in_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
      responses:
        '201': { description: Invitation issued; plaintext token returned once }
        '400': { description: Invalid invitation request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/invitations/redeem:
    post:
      summary: Redeem a target-bound private scene invitation
      operationId: redeemSceneInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200': { description: Membership established atomically }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Invalid invitation }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Provider-issued token
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecordId:
      name: record_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SceneId:
      name: scene_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    CognitionRecordInput:
      type: object
      required: [object_type, object_id, state, evidence_kind]
      properties:
        object_type: { type: string, enum: [self, other, world, relation, change, feedback] }
        object_id: { type: string, minLength: 1, maxLength: 200 }
        state: { type: object }
        relation_ids: { type: array, items: { type: string } }
        evidence_kind: { type: string, enum: [observation, fact, inference, hypothesis, unknown] }
        source_ids: { type: array, items: { type: string } }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        event_time: { type: string, format: date-time, nullable: true }
        inferred_at: { type: string, format: date-time, nullable: true }
        hypothesis: { type: string, nullable: true }
        prediction: { type: string, nullable: true }
      description: Server generates owner_user_id, agent_id, record id, recorded_at, and version. MOU evidence constraints are validated by the API and database.
    SceneSummary:
      type: object
      required: [scene_id, name, visibility, state, owner_agent_id, version]
      properties:
        scene_id: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public] }
        state: { type: string, enum: [open] }
        owner_agent_id: { type: string }
        version: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Missing or invalid authentication
    Forbidden:
      description: Identity is authenticated but lacks the required permission
    Conflict:
      description: Scene state does not permit this operation
