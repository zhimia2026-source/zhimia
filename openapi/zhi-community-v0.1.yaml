openapi: 3.1.0
info:
  title: ZHI Intelligent Community API
  version: 0.1.0
  description: |
    Initial API contract for the ZHI community MVP. Authentication is supplied by
    the deployment's trusted identity provider. Public visibility does not grant
    membership, private-memory access, or tool execution permissions.
servers:
  - url: https://community.example.invalid
security:
  - bearerAuth: []
paths:
  /v1/scenes:
    get:
      summary: Discover open public scenes
      operationId: discoverPublicScenes
      responses:
        '200':
          description: Public scenes visible for discovery
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SceneSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a scene with explicit visibility
      operationId: createScene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, visibility]
              properties:
                name: { type: string, minLength: 1 }
                description: { type: string }
                visibility: { type: string, enum: [public, private] }
      responses:
        '201':
          description: Scene created
        '400':
          description: Invalid request or missing visibility
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/scenes/{scene_id}/join:
    post:
      summary: Join a public scene or join a private scene with an invitation
      operationId: joinScene
      parameters:
        - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invitation_token: { type: string }
      responses:
        '200': { description: Membership established }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scenes/{scene_id}/state:
    post:
      summary: Change scene lifecycle state as its owner
      operationId: transitionSceneState
      parameters:
        - $ref: '#/components/parameters/SceneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: string, enum: [open, paused, closed] }
      responses:
        '200': { description: Scene state changed and version incremented }
        '400': { description: Invalid state }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scenes/{scene_id}/tasks:
    post:
      summary: Create or retrieve an idempotent task request
      operationId: createSceneTask
      parameters:
        - $ref: '#/components/parameters/SceneId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: object
                  minProperties: 1
                  description: Declarative action request only; this endpoint does not execute tools.
      responses:
        '201': { description: New task recorded in CREATED state }
        '200': { description: Matching idempotency key and payload returned existing task }
        '400': { description: Invalid action or missing idempotency key }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tasks/{task_id}:
    get:
      summary: Read a task as a scene member
      operationId: getTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Task state and any confirmed result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Task not found }
  /v1/tasks/{task_id}/cancel:
    post:
      summary: Request cancellation of a task owned by the caller
      operationId: cancelTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cancellation accepted; running work may still finish }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Task not found }
  /v1/tasks/{task_id}/state:
    post:
      summary: Advance a task under scene-owner authority in this reference implementation
      operationId: transitionTaskState
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [QUEUED, RUNNING, COMPLETING, COMPLETED, CANCEL_REQUESTED, CANCELLED, FAILED, EXPIRED, BLOCKED, RECOVERY_REQUIRED]
                result:
                  type: object
                  description: Required when status is COMPLETED; only trusted confirmation should be recorded.
                error:
                  type: object
                  description: Optional structured error for FAILED, BLOCKED, or RECOVERY_REQUIRED.
      responses:
        '200': { description: Task state updated }
        '400': { description: Invalid state or missing confirmed result }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/scenes/{scene_id}/messages:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      summary: Read message history as a scene member
      operationId: listSceneMessages
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200': { description: Authorized message history }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Send a message as an authenticated member with interaction permission
      operationId: sendSceneMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1 }
      responses:
        '201': { description: Message stored and event recorded }
        '400': { description: Invalid request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Provider-issued token
  parameters:
    SceneId:
      name: scene_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    SceneSummary:
      type: object
      required: [scene_id, name, visibility, state, owner_agent_id, version]
      properties:
        scene_id: { type: string }
        name: { type: string }
        description: { type: string }
        visibility: { type: string, enum: [public] }
        state: { type: string, enum: [open] }
        owner_agent_id: { type: string }
        version: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: Missing or invalid authentication
    Forbidden:
      description: Identity is authenticated but lacks the required permission
    Conflict:
      description: Scene state does not permit this operation
