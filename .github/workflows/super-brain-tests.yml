name: Super Brain foundation tests

on:
  pull_request:
    paths:
      - "supabase/functions/zhi-community/index.ts"
      - "supabase/functions/zhi-community/super_brain_helpers.ts"
      - "supabase/functions/zhi-community/super_brain_helpers.test.ts"
      - "supabase/functions/zhi-community/memory_experience_helpers.ts"
      - "supabase/functions/zhi-community/legal_intelligence_helpers.ts"
      - "supabase/functions/zhi-community/legal_intelligence_helpers.test.ts"
      - ".github/workflows/super-brain-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/functions/zhi-community/index.ts"
      - "supabase/functions/zhi-community/super_brain_helpers.ts"
      - "supabase/functions/zhi-community/super_brain_helpers.test.ts"
      - "supabase/functions/zhi-community/memory_experience_helpers.ts"
      - ".github/workflows/super-brain-tests.yml"

permissions:
  contents: read

jobs:
  super-brain-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ZHI community runtime
        run: deno check supabase/functions/zhi-community/index.ts
      - name: Run Super Brain helper tests
        run: deno test supabase/functions/zhi-community/super_brain_helpers.test.ts
      - name: Run Alice legal intelligence helper tests
        run: deno test supabase/functions/zhi-community/legal_intelligence_helpers.test.ts
