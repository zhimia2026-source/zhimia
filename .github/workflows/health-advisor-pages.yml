name: Deploy ZHI Health Advisor and Token Admin

on:
  push:
    branches: [main]
    paths:
      - "web/zhi-health-advisor.html"
      - "web/zhi-health-advisor-client.js"
      - "web/zhi-universe.html"
      - "web/zhi-universe-client.js"
      - "web/zhi-token-admin.html"
      - "web/zhi-resident.html"
      - "web/zhi-resident.js"
      - "web/zhi-resident.webmanifest"
      - "web/zhi-resident-sw.js"
      - "web/zhi-resident-icon.svg"
      - "web/zhi-memory.html"
      - "web/zhi-memory.js"
      - ".github/workflows/health-advisor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: health-advisor-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web/zhi-health-advisor.html _site/index.html
          cp web/zhi-health-advisor-client.js _site/zhi-health-advisor-client.js
          cp web/zhi-token-admin.html _site/token-admin.html
          cp web/zhi-universe.html _site/zhi-universe.html
          cp web/zhi-universe-client.js _site/zhi-universe-client.js
          cp web/zhi-resident.html _site/zhi-resident.html
          cp web/zhi-resident.js _site/zhi-resident.js
          cp web/zhi-resident.webmanifest _site/zhi-resident.webmanifest
          cp web/zhi-resident-sw.js _site/zhi-resident-sw.js
          cp web/zhi-resident-icon.svg _site/zhi-resident-icon.svg
          cp web/zhi-memory.html _site/zhi-memory.html
          cp web/zhi-memory.js _site/zhi-memory.js
          test -s _site/index.html
          test -s _site/zhi-health-advisor-client.js
          test -s _site/token-admin.html
          test -s _site/zhi-universe.html
          test -s _site/zhi-universe-client.js
          test -s _site/zhi-resident.html
          test -s _site/zhi-resident.js
          test -s _site/zhi-resident.webmanifest
          test -s _site/zhi-resident-sw.js
          test -s _site/zhi-resident-icon.svg
          node -e 'const m=require("./_site/zhi-resident.webmanifest"); if(m.display!=="standalone" || m.start_url!=="./zhi-resident.html" || !m.icons?.length) process.exit(1); console.log("Resident PWA manifest valid")'
          grep -q 'serviceWorker.register("./zhi-resident-sw.js"' _site/zhi-resident.js
          grep -q 'Never cache Supabase/API traffic' _site/zhi-resident-sw.js
          test -s _site/zhi-memory.html
          test -s _site/zhi-memory.js
          ! grep -Eiq '(service_role|SUPABASE_SERVICE_ROLE_KEY|AGNES_API_KEY|sk-[A-Za-z0-9]{20,})' _site/index.html _site/token-admin.html _site/zhi-health-advisor-client.js _site/zhi-universe.html _site/zhi-universe-client.js _site/zhi-resident.html _site/zhi-resident.js _site/zhi-resident.webmanifest _site/zhi-resident-sw.js _site/zhi-resident-icon.svg _site/zhi-memory.html _site/zhi-memory.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
