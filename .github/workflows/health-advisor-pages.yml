name: Deploy ZHI Health Advisor and Token Admin

on:
  push:
    branches: [main]
    paths:
      - "web/zhi-health-advisor.html"
      - "web/zhi-health-advisor-client.js"
      - "web/zhi-token-admin.html"
      - "web/zhi-agent-chat.html"
      - ".github/workflows/health-advisor-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: health-advisor-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp web/zhi-health-advisor.html _site/index.html
          cp web/zhi-health-advisor-client.js _site/zhi-health-advisor-client.js _site/chat.html
          cp web/zhi-token-admin.html _site/token-admin.html
          cp web/zhi-agent-chat.html _site/chat.html
          test -s _site/index.html
          test -s _site/zhi-health-advisor-client.js
          test -s _site/token-admin.html
          test -s _site/chat.html
          ! grep -Eiq '(service_role|SUPABASE_SERVICE_ROLE_KEY|AGNES_API_KEY|sk-[A-Za-z0-9]{20,})' _site/index.html _site/token-admin.html _site/zhi-health-advisor-client.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
