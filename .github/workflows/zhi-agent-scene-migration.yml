name: ZHI agent scene membership SQL smoke

on:
  pull_request:
    paths:
      - "supabase/migrations/20261028140000_zhi_community_core.sql"
      - "supabase/migrations/20261030153000_zhi_agent_public_scene_membership.sql"\n      - "supabase/migrations/20261030160000_zhi_agent_private_scene_invitations.sql"
      - "supabase/tests/zhi_agent_public_scene_membership_smoke.sql"
      - ".github/workflows/zhi-agent-scene-migration.yml"
  push:
    branches:
      - feature/intelligent-community-mvp-clean
    paths:
      - "supabase/migrations/20261028140000_zhi_community_core.sql"
      - "supabase/migrations/20261030153000_zhi_agent_public_scene_membership.sql"
      - "supabase/migrations/20261030160000_zhi_agent_private_scene_invitations.sql"
      - "supabase/tests/zhi_agent_public_scene_membership_smoke.sql"
      - ".github/workflows/zhi-agent-scene-migration.yml"

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare minimal Supabase-compatible auth schema and roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d zhi_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users (id uuid primary key);
          grant usage on schema auth to service_role;
          grant select on auth.users to service_role;
          SQL
      - name: Apply community core schema to disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zhi_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261028140000_zhi_community_core.sql
      - name: Apply agent public-scene membership migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zhi_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261030153000_zhi_agent_public_scene_membership.sql
      - name: Apply target-agent private invitation migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zhi_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261030160000_zhi_agent_private_scene_invitations.sql
      - name: Smoke-test ownership, idempotency, least privilege, revoke, and grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d zhi_test -v ON_ERROR_STOP=1 -f supabase/tests/zhi_agent_public_scene_membership_smoke.sql
