name: ZHI community perception tests

on:
  push:
    branches: ["main", "feature/mia-02-aurora-event-perception", "feature/zhi-personality-parameters-v1", "feature/agent-consent-attestation-gateway"]
    paths:
      - "supabase/functions/zhi-community/**"
      - "supabase/functions/zhi-spatial/**"
      - "supabase/functions/zhi-aurora-world-runtime/**"
      - "supabase/functions/zhi-forest-runtime/**"
      - "supabase/functions/zhi-federated-movement/**"
      - "supabase/functions/zhi-federation/**"
      - "supabase/functions/zhi-agent-consent-gateway/**"
      - ".github/workflows/zhi-community-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/zhi-community/**"
      - "supabase/functions/zhi-spatial/**"
      - "supabase/functions/zhi-aurora-world-runtime/**"
      - "supabase/functions/zhi-forest-runtime/**"
      - "supabase/functions/zhi-federated-movement/**"
      - "supabase/functions/zhi-federation/**"
      - "supabase/functions/zhi-agent-consent-gateway/**"
      - ".github/workflows/zhi-community-tests.yml"

jobs:
  scene-awareness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test trusted consent attestation helpers
        run: node --test supabase/functions/zhi-agent-consent-gateway/attestation_helpers.test.mjs
      - name: Type-check trusted consent attestation gateway
        run: deno check supabase/functions/zhi-agent-consent-gateway/index.ts
      - name: Test federated public movement route helper
        run: deno test supabase/functions/zhi-federated-movement/route_helpers_test.ts
      - name: Type-check federated movement Edge Function
        run: deno check supabase/functions/zhi-federated-movement/index.ts
      - name: Type-check federation perception and movement integration
        run: deno check supabase/functions/zhi-federation/index.ts
      - name: Test ecological event perception context
        run: deno test supabase/functions/zhi-community/chat_context_helpers_test.ts
      - name: Test AURORA long-term private memory retrieval
        run: deno test supabase/functions/zhi-community/long_term_memory_helpers_test.ts
      - name: Test long-term memory quality gate
        run: deno test supabase/functions/zhi-community/memory_experience_helpers_test.ts
      - name: Test deterministic AURORA virtual movement validation
        run: deno test supabase/functions/zhi-community/movement_helpers_test.ts
      - name: Test unified AURORA environment event stream
        run: deno test supabase/functions/zhi-spatial/perception_events_test.ts
      - name: Type-check ZHI spatial perception Edge Function
        run: deno check supabase/functions/zhi-spatial/index.ts
      - name: Test MIA peer unified environment event stream
        run: deno test supabase/functions/zhi-aurora-world-runtime/perception_events_test.ts
      - name: Test unified resident position awareness contract
        run: deno test supabase/functions/zhi-aurora-world-runtime/position_contract_test.ts
      - name: Type-check MIA peer world runtime
        run: deno check supabase/functions/zhi-aurora-world-runtime/index.ts
      - name: Type-check MIA forest runtime
        run: deno check supabase/functions/zhi-forest-runtime/index.ts
