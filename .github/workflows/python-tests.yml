name: Python and Edge Function tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Smoke test MINDSTREAM resident chat page
        run: |
          node -e 'const fs=require("fs"); const h=fs.readFileSync("web/mindstream.html","utf8"); const scripts=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)]; if(scripts.length!==1) throw new Error("expected one inline MINDSTREAM script"); new Function(scripts[0][1]); for(const id of ["73eb831a-8e35-4d6a-8654-15f160a2c42d","cf9d1a03-d5d5-4afa-949a-2964671f45d9","30427542-d4c6-4e45-bc68-fabf66f8a6a7"]) if(!h.includes(id)) throw new Error("missing resident mapping: "+id); if(!h.includes("/v1/agents/") || !h.includes("idempotency-key")) throw new Error("resident chat route missing"); if(/SUPABASE_SERVICE_ROLE_KEY|service_role|AGNES_API_KEY|sk-[A-Za-z0-9]{20,}/i.test(h)) throw new Error("server secret pattern in MINDSTREAM"); console.log("MINDSTREAM resident-chat smoke checks passed")'
      - name: Compile Python sources
        run: python -m compileall -q main.py python_worker scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  edge-safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check health advisor Edge Function
        run: deno check supabase/functions/zhi-health-advisor/index.ts
      - name: Type-check ZHI movement Edge Function
        run: deno check supabase/functions/zhi-movement/index.ts
      - name: Type-check ZHI Python Worker Edge Function
        run: deno check supabase/functions/zhi-python-worker/index.ts
      - name: Type-check ZHI community chat integration
        run: deno check supabase/functions/zhi-community/index.ts
      - name: Test resident research invitation and claim markers
        run: deno test supabase/functions/zhi-community/research_invitation_helpers_test.ts
      - name: Run MIA-02 seven-brain diagnostics tests
        run: deno test supabase/functions/zhi-community/seven_brain_helpers_test.ts
      - name: Type-check MINDSTREAM public content Edge Function
        run: deno check supabase/functions/zhi-mindstream/index.ts
      - name: Type-check ZHI research center Edge Function
        run: deno check supabase/functions/zhi-research-center/index.ts
      - name: Test ZHI research center task and artifact gates
        run: deno test supabase/functions/zhi-research-center/transition_helpers_test.ts
      - name: Type-check ZHI token admin Edge Function
        run: deno check supabase/functions/zhi-token-admin/index.ts
      - name: Run health advisor safety tests
        run: deno test supabase/functions/zhi-health-advisor/safety_test.ts
