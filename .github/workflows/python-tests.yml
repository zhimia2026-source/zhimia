name: Python and Edge Function tests

on:
  push:
    branches: [main, feature/intelligent-community-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check token admin capability UI and inline JavaScript
        run: python scripts/check_token_admin_html.py

  edge-safety-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check health advisor Edge Function
        run: deno check supabase/functions/zhi-health-advisor/index.ts
      - name: Run health advisor safety tests
        run: deno test supabase/functions/zhi-health-advisor/safety_test.ts
