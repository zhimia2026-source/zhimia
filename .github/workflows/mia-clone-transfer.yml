name: Mia archive transfer (safety-gated; currently disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mia-zhima-archive-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Safety gate (must not transfer data yet)
        env:
          MIA_SOURCE_SUPABASE_URL: ${{ secrets.MIA_SOURCE_SUPABASE_URL }}
          MIA_SOURCE_SERVICE_ROLE_KEY: ${{ secrets.MIA_SOURCE_SERVICE_ROLE_KEY }}
          ZHIMA_SUPABASE_URL: ${{ secrets.ZHIMA_SUPABASE_URL }}
          ZHIMA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ZHIMA_SUPABASE_SERVICE_ROLE_KEY }}
          MIA_TRANSFER_APPROVAL: ${{ secrets.MIA_TRANSFER_APPROVAL }}
        run: node scripts/mia-clone-transfer.mjs
