name: Health Advisor Static Checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/health-advisor-e2e.mjs"
      - "scripts/health-advisor-token-gateway-e2e.mjs"
      - "supabase/functions/zhi-token-gateway/prompt.ts"
      - "supabase/functions/zhi-token-gateway/safety.ts"
      - "supabase/functions/zhi-token-gateway/safety_test.ts"
      - "supabase/functions/zhi-token-gateway/personality.ts"
      - "config/zee-persona-config.json"
      - "scripts/check-zee-persona-config.mjs"
      - "web/zhi-health-advisor.html"
      - "web/zhi-health-advisor-client.js"
      - ".github/workflows/health-advisor-static-checks.yml"
  pull_request:
    paths:
      - "scripts/health-advisor-e2e.mjs"
      - "scripts/health-advisor-token-gateway-e2e.mjs"
      - "scripts/check-zee-persona-config.mjs"
      - "config/zee-persona-config.json"
      - "supabase/functions/zhi-token-gateway/prompt.ts"
      - "supabase/functions/zhi-token-gateway/safety.ts"
      - "supabase/functions/zhi-token-gateway/safety_test.ts"
      - "web/zhi-health-advisor.html"
      - "web/zhi-health-advisor-client.js"
      - ".github/workflows/health-advisor-static-checks.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check token gateway prompt types
        run: deno check supabase/functions/zhi-token-gateway/prompt.ts
      - name: Run safety override regression tests
        run: deno test --allow-read supabase/functions/zhi-token-gateway/safety_test.ts
      - name: Check canonical persona config matches runtime prompt
        run: node scripts/check-zee-persona-config.mjs
      - name: Check legacy E2E script syntax
        run: node --check scripts/health-advisor-e2e.mjs
      - name: Check personal-token gateway E2E script syntax
        run: node --check scripts/health-advisor-token-gateway-e2e.mjs
      - name: Reject server secrets in browser files
        run: |
          ! grep -Eiq '(service_role|OPENAI_API_KEY|sk-[A-Za-z0-9]{20,})' web/zhi-health-advisor.html web/zhi-health-advisor-client.js
