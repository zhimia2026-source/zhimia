name: ZHI Community MVP Checks

on:
  pull_request:
    paths:
      - "supabase/functions/zhi-community/**"
      - "supabase/migrations/**"
      - "tests/sql/**"
      - ".github/workflows/zhi-community-check.yml"
      - "openapi/**"
      - "docs/**"
  push:
    branches:
      - "feature/intelligent-community-mvp"
      - "feature/intelligent-community-mvp-clean"
    paths:
      - "supabase/functions/zhi-community/**"
      - "supabase/migrations/**"
      - "tests/sql/**"
      - ".github/workflows/zhi-community-check.yml"
      - "openapi/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  contract-and-doc-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse OpenAPI and workflow YAML documents
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "YAML syntax OK " + path }' openapi/zhi-community-v0.1.yaml .github/workflows/zhi-community-check.yml

  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check community Edge Function
        run: deno check supabase/functions/zhi-community/index.ts
      - name: Test token authentication guard
        run: deno test supabase/functions/zhi-community/auth_helpers_test.ts
      - name: Test HTTP principal binding and request authorization
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/http_handler_test.ts
      - name: Test intelligent agent ownership routes
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/agent_routes_test.ts
      - name: Test two-owner private cognition read isolation
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/cognition_routes_test.ts
      - name: Test scene membership isolation guard
        run: deno test supabase/functions/zhi-community/access_helpers_test.ts
      - name: Test offline ontology MOU validation
        run: deno test supabase/functions/zhi-community/ontology_helpers_test.ts
      - name: Test append-only cognitive feedback cycle
        run: deno test supabase/functions/zhi-community/cognitive_cycle_helpers_test.ts
      - name: Test private cognition feedback API isolation
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/feedback_routes_test.ts
      - name: Test private cognition revision proposal routes
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/revision_proposal_routes_test.ts
      - name: Test owner-only cognition revision decisions and rollback routes
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/revision_decision_routes_test.ts
      - name: Test private agent chat context isolation
        run: deno test --allow-env=ZHI_ALLOWED_ORIGINS supabase/functions/zhi-community/chat_routes_test.ts
      - name: Test approved cognitive revisions and rollback
        run: deno test supabase/functions/zhi-community/cognitive_version_helpers_test.ts

  migration-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zhi_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare minimal Supabase-compatible auth schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
      - name: Apply community migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028140000_zhi_community_core.sql
      - name: Apply private cognition migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030120000_zhi_private_cognition_records.sql
      - name: Apply cognition revision proposals migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030150000_zhi_cognition_revision_proposals.sql
      - name: Apply cognition revision decisions migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030170000_zhi_cognition_revision_decisions.sql
      - name: Apply cognition change-note audit migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030190000_zhi_cognition_change_note_audit.sql
      - name: Smoke-test atomic scene creation RPC and access grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/zhi_community_migration_test.sql
