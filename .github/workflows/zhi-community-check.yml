name: ZHI Community MVP Checks

on:
  pull_request:
    paths:
      - "supabase/functions/zhi-community/**"
      - "supabase/migrations/**"
      - "tests/sql/**"
      - ".github/workflows/zhi-community-check.yml"
  push:
    branches:
      - "feature/intelligent-community-mvp"
    paths:
      - "supabase/functions/zhi-community/**"
      - "supabase/migrations/**"
      - "tests/sql/**"
      - ".github/workflows/zhi-community-check.yml"

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check community Edge Function
        run: deno check supabase/functions/zhi-community/index.ts
      - name: Test token authentication guard
        run: deno test supabase/functions/zhi-community/auth_helpers_test.ts
      - name: Test scene membership isolation guard
        run: deno test supabase/functions/zhi-community/access_helpers_test.ts

  migration-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: zhi_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Prepare minimal Supabase-compatible auth schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          SQL
      - name: Apply community migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261028140000_zhi_community_core.sql
      - name: Smoke-test atomic scene creation RPC and access grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/zhi_community_migration_test.sql
