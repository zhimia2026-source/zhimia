# ZHI Edge Function deployment settings.
# zhi-community authenticates ZHI Personal Tokens inside its handler
# (token hash, expiry, revocation, and capability checks). These are not Supabase Auth JWTs.
[functions.zhi-community]
verify_jwt = false

# zhi-movement authenticates owner-bound ZHI Personal Tokens inside its handler.
[functions.zhi-movement]
verify_jwt = false
